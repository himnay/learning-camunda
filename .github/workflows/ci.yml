name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-c7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'  # Camunda 7.24's highest supported JDK
          distribution: 'temurin'
          cache: maven
      - run: mvn -B verify
  build-c8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # Camunda Process Test starts a camunda/camunda container (Docker is available on ubuntu-latest)
      - run: mvn -B verify
        working-directory: camunda-8
