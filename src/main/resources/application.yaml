spring:
  datasource:
    url: jdbc:mysql://localhost:3306/camunda?createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Camunda 7.20+ refuses to start on MySQL's default REPEATABLE_READ (ENGINE-12019)
      transaction-isolation: TRANSACTION_READ_COMMITTED

camunda:
  bpm:
    admin-user:
      id: admin
      password: admin
    generic-properties:
      properties:
        historyTimeToLive: P1D