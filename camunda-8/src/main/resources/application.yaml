server:
  port: 8081 # the C7 app owns 8080

spring:
  application:
    name: learning-camunda-8

camunda:
  client:
    mode: self-managed
    # Camunda 8.8+ flattened the client properties (camunda.client.zeebe.* is gone)
    grpc-address: http://localhost:26500
    rest-address: http://localhost:8088
